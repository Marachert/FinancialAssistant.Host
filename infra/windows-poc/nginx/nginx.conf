events {}

http {
    log_format privacy_safe '$request_method $uri $status '
                            '$body_bytes_sent $request_time';

    upstream public_api_gateway {
        server public-api-gateway:8080;
        keepalive 32;
    }

    server {
        listen 8080 default_server;
        server_name _;

        access_log /var/log/nginx/access.log privacy_safe;
        error_log /var/log/nginx/error.log warn;
        client_max_body_size 12m;

        location = /reverse-proxy-health {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        location / {
            proxy_pass http://public_api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection '';
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
